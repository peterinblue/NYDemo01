<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYDemo01 · Hello World</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1220;
      --card: #121a2b;
      --ink: #e8eefc;
      --muted: #9db0d0;
      --accent: #5b8cff;
      --ok: #3ecf8e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, #1a2a55 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 100%, #0f3d35 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
    }
    .card {
      width: min(560px, calc(100vw - 32px));
      padding: 36px 32px 28px;
      border-radius: 18px;
      background: color-mix(in srgb, var(--card) 92%, white 8%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--ok);
      background: rgba(62, 207, 142, 0.12);
      border: 1px solid rgba(62, 207, 142, 0.28);
    }
    .badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 4px rgba(62, 207, 142, 0.15);
    }
    h1 {
      margin: 18px 0 8px;
      font-size: clamp(2rem, 5vw, 2.6rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }
    .meta {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px dashed rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--muted);
    }
    code {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      color: #c9d7ff;
      background: rgba(91, 140, 255, 0.12);
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">GitHub Pages · Live</div>
    <h1>Hello, <span>World!</span></h1>
    <p>
      这是部署在 <code>peterinblue/NYDemo01</code> 上的测试页面。
      GitHub Pages 已成功上线。
    </p>
    <div class="meta">
      <span>Repo: <code>NYDemo01</code></span>
      <span id="time">—</span>
    </div>
  </main>
  <script>
    document.getElementById("time").textContent =
      "Deployed " + new Date().toLocaleString();
  </script>
</body>
</html>
