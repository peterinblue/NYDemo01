<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>上海闵行航天城 · 3D 数字孪生</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <div class="brand-title">上海闵行航天城</div>
          <div class="brand-sub">3D Digital Twin · NYDemo01</div>
        </div>
      </div>
      <nav class="views" id="views">
        <button data-view="overview" class="active">总览</button>
        <button data-view="west">西区</button>
        <button data-view="axis">中轴</button>
        <button data-view="east">东区</button>
        <button data-view="sports">体育</button>
        <button id="btn-orbit" class="ghost">自动环绕</button>
      </nav>
    </header>

    <aside class="panel" id="panel">
      <div class="panel-kicker">POI 信息</div>
      <h2 id="panel-title">航天城总览</h2>
      <p id="panel-desc">拖拽旋转、滚轮缩放、右键平移。点击建筑或编号点位查看详情。</p>
      <div class="panel-meta" id="panel-meta">
        <div><span>风格</span><b>2.5D 大屏还原</b></div>
        <div><span>范围</span><b>西门 → 东产业区</b></div>
        <div><span>交互</span><b>Orbit + 信息卡</b></div>
      </div>
      <div class="legend">
        <div><i class="sw solar"></i>光伏 A/B/C</div>
        <div><i class="sw tower"></i>地标高塔</div>
        <div><i class="sw power"></i>10KV / 35KV</div>
        <div><i class="sw sport"></i>体育设施</div>
        <div><i class="sw poi"></i>编号点位</div>
      </div>
    </aside>

    <div class="hint" id="hint">正在加载园区模型…</div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
